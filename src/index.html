<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow Pro - Manajemen Tugas Harian</title>
    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 9999px;
      }

      .glass-panel {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
    <!-- Header -->
    <header class="sticky top-0 z-30 glass-panel border-b border-slate-800">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20"
          >
            <i class="fa-solid font-bold fa-check-double text-xl"></i>
          </div>
          <h1
            class="text-xl font-bold tracking-tight text-white flex items-center gap-2"
          >
            TaskFlow
            <span
              class="text-xs px-2 py-0.5 rounded-full bg-sky-950 text-sky-400 font-semibold border border-sky-800"
              >by Heny</span
            >
          </h1>
        </div>
        <div>
          <button
            onclick="openModal()"
            class="flex items-center gap-2 bg-sky-600 hover:bg-sky-500 text-white px-4 py-2.5 rounded-xl font-medium shadow-lg shadow-sky-600/25 transition active:scale-95 text-sm sm:text-base"
          >
            <i class="fa-solid fa-plus"></i>
            <span class="hidden sm:inline">Tugas Baru</span>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
      <!-- Dashboard Stats -->
      <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div
          class="glass-panel p-4 rounded-2xl border border-slate-800 shadow-sm flex items-center gap-4"
        >
          <div
            class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-500 flex items-center justify-center text-xl font-bold shrink-0"
          >
            <i class="fa-solid fa-list-check"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400 font-medium">Total Tugas</p>
            <h3 id="statTotal" class="text-2xl font-bold text-white">0</h3>
          </div>
        </div>

        <div
          class="glass-panel p-4 rounded-2xl border border-slate-800 shadow-sm flex items-center gap-4"
        >
          <div
            class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center text-xl font-bold shrink-0"
          >
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400 font-medium">Selesai</p>
            <h3 id="statCompleted" class="text-2xl font-bold text-emerald-400">
              0
            </h3>
          </div>
        </div>

        <div
          class="glass-panel p-4 rounded-2xl border border-slate-800 shadow-sm flex items-center gap-4"
        >
          <div
            class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-xl font-bold shrink-0"
          >
            <i class="fa-solid fa-clock"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400 font-medium">Sedang Berjalan</p>
            <h3 id="statPending" class="text-2xl font-bold text-amber-400">
              0
            </h3>
          </div>
        </div>

        <div
          class="glass-panel p-4 rounded-2xl border border-slate-800 shadow-sm flex flex-col justify-center"
        >
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-xs text-slate-400 font-medium">Progres</span>
            <span
              id="statProgressPercent"
              class="text-xs font-bold text-sky-400"
              >0%</span
            >
          </div>
          <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden">
            <div
              id="statProgressBar"
              class="bg-gradient-to-r from-sky-500 to-emerald-500 h-full w-0 transition-all duration-500 rounded-full"
            ></div>
          </div>
        </div>
      </section>

      <!-- Search & Filters -->
      <section
        class="glass-panel p-4 rounded-2xl border border-slate-800 shadow-sm mb-6"
      >
        <div
          class="flex flex-col lg:flex-row gap-4 items-center justify-between"
        >
          <div class="relative w-full lg:w-96">
            <i
              class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"
            ></i>
            <input
              type="text"
              id="searchInput"
              oninput="renderApp()"
              placeholder="Cari tugas..."
              class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition"
            />
          </div>

          <div
            class="flex flex-wrap items-center gap-2.5 w-full lg:w-auto justify-start lg:justify-end"
          >
            <div
              class="flex p-1 bg-slate-800/80 rounded-xl text-xs font-medium"
            >
              <button
                onclick="setFilterStatus('all')"
                id="btnStatusAll"
                class="px-3 py-1.5 rounded-lg bg-slate-700 shadow-sm text-white transition font-medium"
              >
                Semua
              </button>
              <button
                onclick="setFilterStatus('active')"
                id="btnStatusActive"
                class="px-3 py-1.5 rounded-lg text-slate-400 transition"
              >
                Aktif
              </button>
              <button
                onclick="setFilterStatus('completed')"
                id="btnStatusCompleted"
                class="px-3 py-1.5 rounded-lg text-slate-400 transition"
              >
                Selesai
              </button>
            </div>

            <select
              id="categoryFilter"
              onchange="renderApp()"
              class="py-2 px-3 rounded-xl bg-slate-800 border border-slate-700 text-xs font-medium text-slate-200 focus:outline-none"
            >
              <option value="ALL">Semua Kategori</option>
              <option value="Pekerjaan">💼 Pekerjaan</option>
              <option value="Pribadi">🏠 Pribadi</option>
              <option value="Belanja">🛒 Belanja</option>
              <option value="Kesehatan">❤️ Kesehatan</option>
              <option value="Belajar">📚 Belajar</option>
            </select>

            <select
              id="sortBySelect"
              onchange="renderApp()"
              class="py-2 px-3 rounded-xl bg-slate-800 border border-slate-700 text-xs font-medium text-slate-200 focus:outline-none"
            >
              <option value="created-desc">Urutan: Terbaru</option>
              <option value="created-asc">Urutan: Terlama</option>
              <option value="due-asc">Tenggat waktu TERDEKAT</option>
              <option value="priority-desc">prioritas TINGGI dulu</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Task List Container -->
      <section class="space-y-3" id="taskListContainer"></section>

      <div
        id="taskErrorState"
        role="alert"
        class="hidden my-6 rounded-2xl border border-rose-800 bg-rose-950/40 p-5 text-center"
      >
        <h3 class="font-semibold text-rose-300">Gagal mengambil data</h3>
        <p id="taskErrorDetail" class="mt-2 text-sm text-rose-200"></p>
        <button
          onclick="fetchTasks()"
          class="mt-4 rounded-lg bg-rose-900 px-4 py-2 text-xs font-semibold text-white transition hover:bg-rose-800"
        >
          Coba Lagi
        </button>
      </div>

      <!-- Empty State -->
      <div
        id="emptyState"
        class="hidden py-16 text-center glass-panel rounded-2xl border border-dashed border-slate-800 my-6"
      >
        <div
          class="w-16 h-16 bg-slate-800 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"
        >
          <i class="fa-solid fa-clipboard-list"></i>
        </div>
        <h3 class="text-base font-semibold text-slate-300">
          Tidak Ada Tugas Ditemukan
        </h3>
        <button
          onclick="openModal()"
          class="mt-4 px-4 py-2 bg-sky-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-sky-500 transition"
        >
          <i class="fa-solid fa-plus mr-1"></i> Tambah Tugas Sekarang
        </button>
      </div>
    </main>

    <!-- Modal Form (Tambah Tugas) -->
    <div
      id="taskModal"
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200"
    >
      <div
        class="bg-slate-900 rounded-2xl border border-slate-800 shadow-2xl max-w-lg w-full p-6 max-h-[90vh] flex flex-col"
      >
        <div
          class="flex items-center justify-between pb-4 border-b border-slate-800"
        >
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-square-plus text-sky-500"></i> Tambah Tugas
            Baru
          </h2>
          <button
            onclick="closeModal()"
            class="text-slate-400 hover:text-slate-200"
          >
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>

        <form
          id="taskForm"
          onsubmit="handleSaveTask(event)"
          class="pt-4 space-y-4 overflow-y-auto pr-1"
        >
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1"
              >Judul Tugas <span class="text-rose-500">*</span></label
            >
            <input
              type="text"
              id="taskTitle"
              required
              placeholder="Misal: Rapat Event Panahan"
              class="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-sky-500"
            />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1"
                >Kategori</label
              >
              <select
                id="taskCategory"
                class="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none"
              >
                <option value="Pekerjaan">💼 Pekerjaan</option>
                <option value="Pribadi">🏠 Pribadi</option>
                <option value="Belanja">🛒 Belanja</option>
                <option value="Kesehatan">❤️ Kesehatan</option>
                <option value="Belajar">📚 Belajar</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1"
                >Prioritas</label
              >
              <select
                id="taskPriority"
                class="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none"
              >
                <option value="low">🟢 Rendah</option>
                <option value="medium" selected>🟡 Sedang</option>
                <option value="high">🔴 Tinggi</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1"
              >Tenggat Waktu</label
            >
            <input
              type="date"
              id="taskDueDate"
              class="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1"
              >Deskripsi</label
            >
            <textarea
              id="taskDescription"
              rows="2"
              placeholder="Catatan opsional..."
              class="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none resize-none"
            ></textarea>
          </div>

          <!-- Subtasks Section -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1"
              >Sub-Tugas / Checklists</label
            >
            <div class="flex gap-2 mb-2">
              <input
                type="text"
                id="subtaskInput"
                placeholder="Tambah langkah kerja..."
                class="flex-1 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none"
              />
              <button
                type="button"
                onclick="addSubtaskModal()"
                class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-medium text-white rounded-lg transition"
              >
                + Tambah
              </button>
            </div>
            <ul id="subtaskListModal" class="space-y-1.5"></ul>
          </div>

          <div class="pt-3 border-t border-slate-800 flex justify-end gap-2">
            <button
              type="button"
              onclick="closeModal()"
              class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700 transition"
            >
              Batal
            </button>
            <button
              type="submit"
              class="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold shadow-md shadow-sky-600/20 transition"
            >
              Simpan ke Database
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- JavaScript Frontend + MySQL Integration -->
    <script>
      let tasks = [];
      let currentFilterStatus = "all";
      let tempSubtasks = [];

      const categoryColors = {
        Pekerjaan: "bg-blue-900/40 text-blue-300 border-blue-800",
        Pribadi: "bg-emerald-900/40 text-emerald-300 border-emerald-800",
        Belanja: "bg-purple-900/40 text-purple-300 border-purple-800",
        Kesehatan: "bg-rose-900/40 text-rose-300 border-rose-800",
        Belajar: "bg-amber-900/40 text-amber-300 border-amber-800",
      };

      function describeHttpError(status, statusText) {
        if (status === 400) {
          return "Kode 400 (Bad Request): permintaan tidak valid atau format datanya salah.";
        }
        if (status === 529) {
          return "Kode 529: server sedang kelebihan beban. Silakan coba lagi nanti.";
        }
        return `Kode ${status}${statusText ? ` (${statusText})` : ""}: server gagal memproses permintaan.`;
      }

      async function fetchTasks() {
        try {
          const response = await fetch("/api/tasks");
          if (!response.ok) {
            throw new Error(
              describeHttpError(response.status, response.statusText),
            );
          }

          const data = await response.json();
          if (!Array.isArray(data)) {
            throw new Error("Format data tugas dari server tidak valid.");
          }

          tasks = data;
          document.getElementById("taskErrorState").classList.add("hidden");
          renderApp();
        } catch (err) {
          console.error("Gagal mengambil data:", err);
          document.getElementById("taskErrorDetail").textContent =
            err instanceof Error
              ? err.message
              : "Tidak dapat terhubung ke server.";
          document.getElementById("taskErrorState").classList.remove("hidden");
        }
      }

      function addSubtaskModal() {
        const input = document.getElementById("subtaskInput");
        if (!input.value.trim()) return;
        tempSubtasks.push({ title: input.value.trim(), completed: false });
        input.value = "";
        renderSubtasksModal();
      }

      function renderSubtasksModal() {
        const list = document.getElementById("subtaskListModal");
        list.innerHTML = tempSubtasks
          .map(
            (s, index) => `
                <li class="flex items-center justify-between text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                    <span class="text-slate-300">${s.title}</span>
                    <button type="button" onclick="tempSubtasks.splice(${index}, 1); renderSubtasksModal();" class="text-rose-400 hover:underline">Hapus</button>
                </li>
            `,
          )
          .join("");
      }

      async function handleSaveTask(event) {
        event.preventDefault();
        const newTask = {
          title: document.getElementById("taskTitle").value,
          category: document.getElementById("taskCategory").value,
          priority: document.getElementById("taskPriority").value,
          due_date: document.getElementById("taskDueDate").value,
          description: document.getElementById("taskDescription").value,
          subtasks: tempSubtasks,
        };

        try {
          const response = await fetch("/api/tasks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newTask),
          });

          if (response.ok) {
            closeModal();
            document.getElementById("taskForm").reset();
            tempSubtasks = [];
            document.getElementById("subtaskListModal").innerHTML = "";
            fetchTasks();
          }
        } catch (err) {
          console.error("Gagal menyimpan tugas:", err);
        }
      }

      async function toggleTaskStatus(id, currentStatus) {
        const newStatus = !currentStatus;
        try {
          await fetch(`/api/tasks/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              completed: newStatus,
              updateSubtasks: newStatus,
            }),
          });
          fetchTasks();
        } catch (err) {
          console.error(err);
        }
      }

      async function toggleSubtask(subId, currentStatus) {
        const newSubStatus = !currentStatus;
        try {
          await fetch(`/api/subtasks/${subId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ completed: newSubStatus }),
          });
          fetchTasks();
        } catch (err) {
          console.error("Gagal mengubah sub-tugas:", err);
        }
      }

      async function deleteTask(id) {
        if (!confirm("Yakin ingin menghapus tugas ini?")) return;
        try {
          await fetch(`/api/tasks/${id}`, { method: "DELETE" });
          fetchTasks();
        } catch (err) {
          console.error(err);
        }
      }

      function setFilterStatus(status) {
        currentFilterStatus = status;
        ["btnStatusAll", "btnStatusActive", "btnStatusCompleted"].forEach(
          (id) => {
            document.getElementById(id).className =
              "px-3 py-1.5 rounded-lg text-slate-400 transition";
          },
        );
        if (status === "all")
          document.getElementById("btnStatusAll").className =
            "px-3 py-1.5 rounded-lg bg-slate-700 shadow-sm text-white transition font-medium";
        if (status === "active")
          document.getElementById("btnStatusActive").className =
            "px-3 py-1.5 rounded-lg bg-slate-700 shadow-sm text-white transition font-medium";
        if (status === "completed")
          document.getElementById("btnStatusCompleted").className =
            "px-3 py-1.5 rounded-lg bg-slate-700 shadow-sm text-white transition font-medium";
        renderApp();
      }

      function renderApp() {
        const container = document.getElementById("taskListContainer");
        const emptyState = document.getElementById("emptyState");
        const searchText = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();
        const categoryValue = document.getElementById("categoryFilter").value;
        const sortVal = document.getElementById("sortBySelect").value;

        let filtered = tasks.filter((task) => {
          if (currentFilterStatus === "active" && task.completed) return false;
          if (currentFilterStatus === "completed" && !task.completed)
            return false;
          if (categoryValue !== "ALL" && task.category !== categoryValue)
            return false;
          if (searchText && !task.title.toLowerCase().includes(searchText))
            return false;
          return true;
        });

        filtered.sort((a, b) => {
          if (sortVal === "created-desc") return b.id - a.id;
          if (sortVal === "created-asc") return a.id - b.id;
          if (sortVal === "due-asc") {
            if (!a.due_date) return 1;
            if (!b.due_date) return -1;
            return new Date(a.due_date) - new Date(b.due_date);
          }
          if (sortVal === "priority-desc") {
            const priorityWeight = { high: 3, medium: 2, low: 1 };
            return (
              (priorityWeight[b.priority] || 2) -
              (priorityWeight[a.priority] || 2)
            );
          }
          return 0;
        });

        const total = tasks.length;
        const completed = tasks.filter((t) => t.completed).length;
        const pending = total - completed;
        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

        document.getElementById("statTotal").innerText = total;
        document.getElementById("statCompleted").innerText = completed;
        document.getElementById("statPending").innerText = pending;
        document.getElementById("statProgressPercent").innerText =
          `${percent}%`;
        document.getElementById("statProgressBar").style.width = `${percent}%`;

        if (filtered.length === 0) {
          container.innerHTML = "";
          emptyState.classList.remove("hidden");
          return;
        }

        emptyState.classList.add("hidden");
        container.innerHTML = filtered
          .map((task) => {
            const catClass =
              categoryColors[task.category] ||
              "bg-slate-800 text-slate-300 border-slate-700";

            return `
                    <div class="glass-panel p-4 rounded-2xl border border-slate-800 shadow-sm space-y-3 transition">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" ${task.completed ? "checked" : ""} onclick="toggleTaskStatus(${task.id}, ${task.completed})" class="w-5 h-5 accent-sky-600 rounded cursor-pointer">
                                <div>
                                    <h4 class="font-semibold text-sm sm:text-base ${task.completed ? "line-through text-slate-500" : "text-white"}">${task.title}</h4>
                                    <p class="text-xs text-slate-400 mt-0.5">${task.description || "Tanpa deskripsi"} • <span class="text-sky-400 font-medium">Due: ${task.due_date ? task.due_date.split("T")[0] : "Tidak ada"}</span></p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${catClass}">${task.category || "Pekerjaan"}</span>
                                <button onclick="deleteTask(${task.id})" class="text-slate-400 hover:text-rose-500 p-2 transition"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                        ${
                          task.subtasks && task.subtasks.length > 0
                            ? `
                            <div class="pl-8 pt-2 border-t border-slate-800/60 space-y-1">
                                ${task.subtasks
                                  .map(
                                    (sub) => `
                                    <div class="flex items-center gap-2 text-xs">
                                        <input type="checkbox" ${sub.completed ? "checked" : ""} onclick="toggleSubtask(${sub.id}, ${sub.completed})" class="w-4 h-4 accent-sky-600 rounded cursor-pointer">
                                        <span class="${sub.completed ? "line-through text-slate-500" : "text-slate-300"}">${sub.title}</span>
                                    </div>
                                `,
                                  )
                                  .join("")}
                            </div>
                        `
                            : ""
                        }
                    </div>
                `;
          })
          .join("");
      }

      function openModal() {
        document
          .getElementById("taskModal")
          .classList.remove("opacity-0", "pointer-events-none");
      }
      function closeModal() {
        document
          .getElementById("taskModal")
          .classList.add("opacity-0", "pointer-events-none");
        tempSubtasks = [];
      }

      fetchTasks();
    </script>
  </body>
</html>
